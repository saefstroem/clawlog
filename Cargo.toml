[package]
name = "clawlog"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Log every prompt and response that is sent in-between you and your LLM of choice."
license = "MIT"
repository = "https://github.com/saefstroem/clawlog"
keywords = ["claude", "llm", "logging", "hooks", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[workspace]
members = ["."]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
